<html>
    <head>
        <title>Mandelbrot Set</title>
    </head>

    <body>
        <h1>Mandelbrot Set</h1>

        <div>
            <label>Height:</label>
            <input type="number" id="heightInput" value="600" min="1" step="1.00"/>
            <label>Width:</label>
            <input type="number" id="widthInput" value="800" min="1" step="1.00"/>
            <label>Max Iterations:</label>
            <input type="number" id="maxIterationsInput" value="100.00" min="1" step="1.00"/>
            <button id="renderButton" onclick="startRendering()">Render</button>
        </div>
        <div>
            <canvas id="mandelbrotCanvas" width="800" height="600"></canvas>
        </div>
        

        <script>
            // Default values
            var maxIterations = 100;
            var height = 600;
            var width = 800;
            var xMin = -2;
            var xMax = 1;
            var yMin = -1.5;
            var yMax = 1.5;
            var pixelx = 0;
            var pixely = 0;
            let workers = [];

            // Variable to keep track of the next row to be rendered
            let nextRow = 0;

            // Initialize canvas and context
            var canvas = document.getElementById('mandelbrotCanvas');
            // Get the 2D rendering context
            const ctx = canvas.getContext('2d');
            // Variable to store the image data
            var imagedata;

            // Get max iterations from input field
            function getMaxIterations() {
                const maxIterationsInput = document.getElementById('maxIterationsInput');
                return parseInt(maxIterationsInput.value);
            }

            //get height from input field
            function getHeight() {
                const heightInput = document.getElementById('heightInput');
                return parseInt(heightInput.value);
            }

            //get width from input field
            function getWidth() {
                const widthInput = document.getElementById('widthInput');
                return parseInt(widthInput.value);
            }

            // Function to start rendering the Mandelbrot set
            function startRendering() {
                maxIterations = getMaxIterations();

                width = getWidth();
                height = width * 0.75; 

                // Update canvas size
                canvas.width = width;
                canvas.height = height;

                // Get the image data for the canvas
                imagedata = ctx.getImageData(0,0, canvas.width, canvas.height);

                // Render the Mandelbrot set
                renderMandelbrotSet();
            }
            
            // Function to render the Mandelbrot set using Web Workers
            function renderMandelbrotSet() {
                for (const worker of workers) {
                    worker.terminate();
                }

                workers = [];
                let maxWorkers = 6;
                nextRow = 0;

                for (let i = 0; i < maxWorkers; i++) {
                    // Create a new worker
                    const worker = new Worker("worker.js");

                    // Listen for messages from the worker
                    worker.onmessage = function(event) {
                        const row = event.data.row;
                        const colors = event.data.colors;

                        for (let x = 0; x < colors.length; x++) {
                            ctx.fillStyle = colors[x];
                            ctx.fillRect(x, row, 1, 1);
                        }

                        assignNextRow(worker);
                    };

                    assignNextRow(worker);
                }
                //-- console.log("Message sent");
            }

            // Function to assign the next row to a worker
            function assignNextRow(worker) {
                // Check if there are more rows to render
                if (nextRow >= height) {
                    return;
                }
                
                // Send the next row to the worker
                worker.postMessage({
                    width: width,
                    height: height,
                    maxIterations: maxIterations,
                    xMin: xMin,
                    xMax: xMax,
                    yMin: yMin,
                    yMax: yMax,
                    pixely: nextRow
                });

                nextRow++;
            }
            

            canvas.addEventListener('click', function(event) {
                const rect = canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                const xRange = xMax - xMin;
                const yRange = yMax - yMin;

                const centerY =yMax -(y / height) * yRange;
                const centerX =xMin +(x / width) * xRange;

                const newXMin = centerX - xRange / 4;
                const newXMax = centerX + xRange / 4;

                const newYMin = centerY - yRange / 4;
                const newYMax = centerY + yRange / 4;

                xMin = newXMin;
                xMax = newXMax;
                yMin = newYMin;
                yMax = newYMax;

                startRendering();
            });
        </script>
    </body>
</html>
